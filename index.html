</style></head><body class="panel-open"><canvas id="screen" aria-label="Audio-reactive precision ASCII art"></canvas><div id="hud"><b>GHOST//FREQ <span>PRECISION//07</span></b><span id="status">DEMO // NO AUDIO</span></div><button id="reveal" aria-label="Show controls">☷</button><section id="panel"><div class="top"><strong>ENGINE // HYBRID PRECISION</strong><button id="hide">HIDE ×</button></div><div class="controls"><button class="primary" id="mic">ENABLE MIC</button><button id="demo">DEMO: ON</button><button id="wake">KEEP AWAKE: OFF</button></div><div class="controls"><label>STRUCTURE<select id="preset"><option value="contour">CONTOUR FIELD</option><option value="orbital">ORBITAL ARRAY</option><option value="weave">SIGNAL WEAVE</option><option value="tunnel">PRECISION TUNNEL</option></select></label><label>RENDER<select id="style"><option value="ascii">FINE ASCII</option><option value="braille">BRAILLE</option><option value="blocks">MICRO BLOCKS</option><option value="binary">BINARY</option></select></label><label>PALETTE<select id="palette"><option value="mono">MONO + PINK</option><option value="pink">NEON PINK</option><option value="ice">ICE BLUE</option><option value="green">PHOSPHOR</option><option value="white">MONO</option></select></label></div><div class="controls"><label>PRECISION <span id="detailVal"></span><input id="detail" type="range" min="45" max="100" step="5" value="75"></label><label>REACTIVITY <span id="sensitivityVal"></span><input id="sensitivity" type="range" min="0.5" max="3" step="0.1" value="1.4"></label><label>FLUIDITY <span id="fluidVal"></span><input id="fluid" type="range" min="0" max="100" step="5" value="35"></label><label>GLITCH <span id="glitchVal"></span><input id="glitch" type="range" min="0" max="30" step="1" value="3"></label><label>AUTO SWITCH<select id="auto"><option value="0">OFF</option><option value="60">1 MIN</option><option value="180">3 MIN</option><option value="300">5 MIN</option></select></label></div><div class="me (()=>{'use strict';const $=id=>document.getElementById(id),c=$('screen'),ctx=c.getContext('2d',{alpha:false});const defaults={preset:'contour',style:'ascii',palette:'mono',detail:'75',sensitivity:'1.4',fluid:'35',glitch:'3',auto:'0'},settings={};let resizePending=true,nextSwitch=0;for(const [key,fallback] of Object.entries(defaults)){let v=fallback;try{v=localStorage.getItem('gf07_'+key)||fallback}catch{}const control=$(key);if([...control.options||[]].length&&![...control.options].some(o=>o.value===v))v=fallback;if(control.type==='range'&&!Number.isFinite(Number(v)))v=fallback;control.value=v;settings[key]=v;control.addEventListener('input',()=>{settings[key]=control.value;try{localStorage.setItem('gf07_'+key,settings[key])}catch{};if(key==='detail'||key==='style')resizePending=true;if(key==='auto')nextSwitch=0;labels()})}function labels(){for(const k of ['detail','sensitivity','fluid','glitch'])$(k+'Val').textContent=settings[k]+(k==='detail'||k==='fluid'||k==='glitch'?'%':'×')}labels();
let W=0,H=0,dpr=1,cellW=9,cellH=13,cols=0,rows=0,font=12;function resize(){W=window.innerWidth;H=window.innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);const density=Number(settings.detail);cellW=Math.max(5.7,12.5-(density-45)*.095);cellH=cellW*1.48;cols=Math.ceil(W/cellW)+1;rows=Math.ceil(H/cellH)+1;font=cellH*.93;resizePending=false}addEventListener('resize',()=>resizePending=true);addEventListener('orientationchange',()=>resizePending=true);resize();
let ac=null,analyser=null,stream=null,source=null,fft=null,live=false,demo=true;const E={bass:0,mids:0,high:0,beat:0};let floor=.045,previous=.0,lastBeat=0;function band(lo,hi){if(!fft||!ac)return 0;const nyq=ac.sampleRate/2,a=Math.max(0,Math.floor(lo/nyq*fft.length)),b=Math.min(fft.length,Math.ceil(hi/nyq*fft.length));let sum=0;for(let i=a;i<b;i++)sum+=fft[i];return b>a?sum/(b-a)/255:0}async function stopMic(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(ac){try{await ac.close()}catch{}}ac=null;analyser=null;fft=null;source=null;live=false;$('mic').textContent='ENABLE MIC';$('status').textContent=demo?'DEMO // NO AUDIO':'IDLE'}async function startMic(){try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Use HTTPS in Safari to enable microphone.');const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});const a=new(window.AudioContext||window.webkitAudioContext)();await a.resume();const node=a.createAnalyser();node.fftSize=2048;node.smoothingTimeConstant=.72;const src=a.createMediaStreamSource(s);src.connect(node);await stopMic();ac=a;stream=s;source=src;analyser=node;fft=new Uint8Array(node.frequencyBinCount);live=true;demo=false;$('mic').textContent='STOP MIC';$('demo').textContent='DEMO: OFF';$('status').textContent='LIVE // MIC';$('hint').textContent='Microphone live. Bass drives scale; mids bend geometry; highs add delicate texture.'}catch(e){$('hint').textContent='Microphone: '+e.message}}$('mic').onclick=()=>live?stopMic():startMic();$('demo').onclick=()=>{demo=!demo;$('demo').textContent='DEMO: '+(demo?'ON':'OFF');if(demo&&live)stopMic();$('status').textContent=live?'LIVE // MIC':demo?'DEMO // NO AUDIO':'IDLE'};
let wake=null,wakeWanted=false;async function keepAwake(){if(!('wakeLock'in navigator)){$('hint').textContent='Wake Lock unavailable on this browser.';wakeWanted=false;return}try{wake=await navigator.wakeLock.request('screen');$('wake').textContent='KEEP AWAKE: ON';wake.addEventListener('release',()=>{wake=null;$('wake').textContent='KEEP AWAKE: OFF'})}catch(e){$('hint').textContent='Wake lock: '+e.message}}$('wake').onclick=async()=>{wakeWanted=!wakeWanted;if(wakeWanted)await keepAwake();else{if(wake)await wake.release();wake=null;$('wake').textContent='KEEP AWAKE: OFF'}};document.addEventListener('visibilitychange',()=>{if(!document.hidden&&wakeWanted&&!wake)keepAwake()});
let open=true,hideTimer;function panel(v){open=v;$('panel').classList.toggle('hidden',!v);document.body.classList.toggle('panel-open',v);clearTimeout(hideTimer);if(v)hideTimer=setTimeout(()=>panel(false),15000)}$('hide').onclick=()=>panel(false);$('reveal').onclick=()=>panel(true);c.addEventListener('click',()=>panel(!open));panel(true);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),lerp=(a,b,f)=>a+(b-a)*f;let clock=0,last=0,beatFlash=0,beatClock=0;function audio(t,dt){if(live&&analyser){analyser.getByteFrequencyData(fft);const raw=[band(40,180),band(180,2200),band(2200,8500)];const avg=(raw[0]+raw[1]+raw[2])/3;floor=lerp(floor,Math.max(.02,avg),.004);const gain=clamp(.15/Math.max(.04,floor),.7,2.5)*Number(settings.sensitivity);for(const [i,k] of ['bass','mids','high'].entries()){const target=clamp(raw[i]*gain);E[k]=lerp(E[k],target,1-Math.exp(-dt*(target>E[k]?9:4)))}const onset=raw[0]-previous;previous=lerp(previous,raw[0],1-Math.exp(-dt*5));if(onset>.065&&t-lastBeat>.27){beatFlash=1;lastBeat=t}}else if(demo){const target={bass:.24+.29*Math.pow(Math.max(0,Math.sin(t*2.2)),8),mids:.25+.16*Math.sin(t*.65)**2,high:.18+.12*Math.sin(t*1.3)**2};for(const k of ['bass','mids','high'])E[k]=lerp(E[k],target[k],.12);if(Math.sin(t*2.2)>.985&&t-lastBeat>.3){beatFlash=1;lastBeat=t}}else for(const k of ['bass','mids','high'])E[k]*=.97;beatFlash*=Math.exp(-dt*7);E.beat=beatFlash;for(const k of ['bass','mids','high'])$(k).style.width=Math.round(E[k]*100)+'%'}
// Continuous mathematical fields: audio deforms their coordinates, not their character identities.
function field(x,y,t,p){const r=Math.hypot(x,y),a=Math.atan2(y,x);switch(p){case 'orbital':{const rings=Math.cos(r*23-1.8*Math.sin(a*5+t*.23));const spokes=Math.cos(a*16+Math.sin(r*7-t*.32)*.65);return rings*.73+spokes*.27}case 'weave':{const u=x+.09*Math.sin(y*7+t*.32),v=y+.09*Math.sin(x*6-t*.29);return Math.cos(u*21)*Math.cos(v*18)*.7+Math.sin((u+v)*10)*.3}case 'tunnel':{const rings=Math.cos(20*Math.log(r+.25)+Math.sin(a*6+t*.25)*.8);const angular=Math.cos(a*12+Math.log(r+.3)*4);return rings*.72+angular*.28}default:{const ridge=Math.cos(r*26+2.1*Math.sin(a*5+t*.18));const flow=Math.sin(y*15+2*Math.sin(x*6+t*.28));return ridge*.72+flow*.28}}}
const palettes={mono:[226,231,241],pink:[255,94,167],ice:[95,214,255],green:[104,245,177],white:[239,240,241]};const glyphs={ascii:'  .·:;+=xX#%@',braille:' ⠁⠃⠇⠏⠟⠿⣿',blocks:'  ░▒▓█',binary:'  0 1 0 1 1'};const presets=['contour','orbital','weave','tunnel'];function render(now){requestAnimationFrame(render);if(now-last<30)return;const dt=Math.min(.06,(now-last)/1000||.03);last=now;if(resizePending)resize();const t=now/1000;audio(t,dt);clock+=dt*(.18+E.mids*.2);if(+settings.auto){if(!nextSwitch)nextSwitch=now+Number(settings.auto)*1000;if(now>nextSwitch){settings.preset=presets[(presets.indexOf(settings.preset)+1)%presets.length];$('preset').value=settings.preset;try{localStorage.setItem('gf07_preset',settings.preset)}catch{}nextSwitch=now+Number(settings.auto)*1000}}else nextSwitch=0;ctx.fillStyle='#05070b';ctx.fillRect(0,0,W,H);ctx.font=`${font}px ui-monospace,Menlo,Consolas,monospace`;ctx.textBaseline='top';const chars=glyphs[settings.style],color=palettes[settings.palette],fluid=Number(settings.fluid)/100,glitch=Number(settings.glitch)/100;const aspect=W/H,scale=1-.075*E.bass-.035*E.beat;const midWarp=fluid*(.025+.075*E.mids);const accent=settings.palette==='mono';const timeBucket=Math.floor(t*7);for(let row=0;row<rows;row++){const y=(row*cellH/H-.5)*2;for(let col=0;col<cols;col++){const x=(col*cellW/W-.5)*2*aspect;const dx=x*scale+Math.sin(y*5+clock)*midWarp;const dy=y*scale+Math.sin(x*4-clock*.85)*midWarp;const v=field(dx,dy,clock,settings.preset);const ridge=1-Math.abs(v);const lines=Math.pow(clamp(1-ridge/.29),1.2);const shading=clamp((v+1)*.34);const level=clamp(.11+lines*.77+shading*.13);let idx=Math.min(chars.length-1,Math.floor(level*(chars.length-1)));if(idx===0)continue;const seed=Math.sin(col*127.1+row*311.7)*43758.545;const noise=seed-Math.floor(seed);const rareGlitch=E.beat>.62&&noise<glitch*.018&&((col+timeBucket)%7===0);if(rareGlitch)idx=chars.length-1;const ch=chars[idx];if(ch===' ')continue;const pink=accent&&(lines>.83||rareGlitch);const rgb=pink?[255,85,160]:color;const alpha=clamp(.16+lines*.68+shading*.16+(rareGlitch?.2:0),.1,.95);ctx.fillStyle=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha.toFixed(2)})`;ctx.fillText(ch,col*cellW,row*cellH)}}}requestAnimationFrame(render);
