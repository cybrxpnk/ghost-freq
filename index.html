/div></div><span>MIDS</span><div class="track"><div id="mids" class="fill"></div></div><span>HIGH</span><div class="track"><div id="high" class="fill"></div></div></div><div class="hint" id="help">Tap ENABLE MIC and allow microphone access. Play music through another device or Alexa speaker. Tap the artwork to show/hide controls. Settings save on this device.</div></section>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('screen'),ctx=canvas.getContext('2d',{alpha:false});const keys=['preset','style','palette','sensitivity','detail','auto'];const defaults={preset:'tunnel',style:'ascii',palette:'pink',sensitivity:'1.6',detail:'65',auto:'0'};const settings={};for(const key of keys){let value=defaults[key];try{value=localStorage.getItem('gf06_'+key)||value}catch{}if(key==='preset'&&!['tunnel','matrix','vortex','rain','wave'].includes(value))value=defaults[key];if(key==='style'&&!['ascii','braille','blocks','binary'].includes(value))value=defaults[key];if(key==='palette'&&!['pink','ice','green','red','white'].includes(value))value=defaults[key];if(key==='auto'&&!['0','30','60','180','300'].includes(value))value='0';settings[key]=value;$(key).value=value;$(key).addEventListener('input',()=>{settings[key]=$(key).value;try{localStorage.setItem('gf06_'+key,settings[key])}catch{};updateLabels();if(key==='detail')resize();if(key==='auto')nextSwitch=performance.now()+Number(settings.auto)*1000;});}function updateLabels(){$('sensVal').textContent=settings.sensitivity;$('detailVal').textContent=settings.detail}updateLabels();
const colors={pink:[255,61,158],ice:[62,206,255],green:[90,255,155],red:[255,75,83],white:[238,241,245]};let width=0,height=0,dpr=1,cols=0,rows=0,cellW=0,cellH=0,fontSize=0;function resize(){width=window.innerWidth;height=window.innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);canvas.style.width=width+'px';canvas.style.height=height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);const target=Number(settings.detail);cellW=Math.max(5,width/Math.max(35,Math.round(target*width/900)));cellH=cellW*1.55;cols=Math.ceil(width/cellW)+1;rows=Math.ceil(height/cellH)+1;fontSize=cellH*.93;ctx.font=`${fontSize}px ui-monospace,Menlo,monospace`;ctx.textBaseline='top';}addEventListener('resize',resize);resize();
let audioContext=null,analyser=null,stream=null,source=null,fft=null,micActive=false,demo=true,wakeLock=null;let energies={bass:0,mids:0,high:0,beat:0},baseline=0.1,prevBass=0,beatDecay=0,lastBeat=0;let nextSwitch=0,lastFrame=0,frame=0,phase=0;const names=['tunnel','matrix','vortex','rain','wave'];
function average(from,to){if(!fft||!audioContext)return 0;const nyquist=audioContext.sampleRate/2;const lo=Math.max(0,Math.floor(from/nyquist*fft.length)),hi=Math.min(fft.length,Math.ceil(to/nyquist*fft.length));let sum=0;for(let i=lo;i<hi;i++)sum+=fft[i];return hi>lo?sum/(hi-lo)/255:0}
async function startMic(){try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Microphone unavailable here. Use Safari over HTTPS.');const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});const ac=new (window.AudioContext||window.webkitAudioContext)();await ac.resume();const a=ac.createAnalyser();a.fftSize=2048;a.smoothingTimeConstant=.73;const src=ac.createMediaStreamSource(s);src.connect(a);await stopMic();stream=s;audioContext=ac;analyser=a;source=src;fft=new Uint8Array(a.frequencyBinCount);micActive=true;demo=false;$('mic').textContent='STOP MIC';$('demo').textContent='DEMO: OFF';$('state').textContent='LIVE // MICROPHONE';$('help').textContent='Microphone active. For reliable results, play music through Alexa or another speaker near the iPad.';}catch(e){$('help').textContent='Mic error: '+e.message;console.error(e)}}
async function stopMic(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(audioContext){try{await audioContext.close()}catch{}audioContext=null}source=null;analyser=null;fft=null;micActive=false;$('mic').textContent='ENABLE MIC';$('state').textContent=demo?'DEMO // NO AUDIO':'IDLE // NO AUDIO'}
$('mic').onclick=()=>micActive?stopMic():startMic();$('demo').onclick=()=>{demo=!demo;$('demo').textContent='DEMO: '+(demo?'ON':'OFF');if(demo&&micActive)stopMic();$('state').textContent=micActive?'LIVE // MICROPHONE':demo?'DEMO // NO AUDIO':'IDLE // NO AUDIO'};
async function releaseWake(){if(wakeLock){try{await wakeLock.release()}catch{}wakeLock=null}$('wake').textContent='KEEP AWAKE: OFF'}let wakeWanted=false;async function acquireWake(){if(!('wakeLock' in navigator)){$('help').textContent='Wake Lock is not supported in this browser. Use iPad Auto-Lock settings if needed.';wakeWanted=false;return}try{wakeLock=await navigator.wakeLock.request('screen');$('wake').textContent='KEEP AWAKE: ON';wakeLock.addEventListener('release',()=>{$('wake').textContent='KEEP AWAKE: OFF'})}catch(e){$('help').textContent='Wake lock unavailable: '+e.message}}$('wake').onclick=async()=>{wakeWanted=!wakeWanted;if(wakeWanted)await acquireWake();else await releaseWake()};document.addEventListener('visibilitychange',()=>{if(!document.hidden&&wakeWanted&&!wakeLock)acquireWake()});
const panel=$('panel');let panelOpen=true,hideTimer;function showPanel(show){panelOpen=show;panel.classList.toggle('hidden',!show);document.body.classList.toggle('panel-open',show);clearTimeout(hideTimer);if(show)hideTimer=setTimeout(()=>showPanel(false),13000)}$('hide').onclick=()=>showPanel(false);$('reveal').onclick=()=>showPanel(true);canvas.addEventListener('click',()=>showPanel(!panelOpen));showPanel(true);
function clamp(v,a=0,b=1){return Math.max(a,Math.min(b,v))}function mix(a,b,t){return a+(b-a)*t}function sampleAudio(t){if(micActive&&analyser){analyser.getByteFrequencyData(fft);const sensitivity=Number(settings.sensitivity);let rawB=average(35,180),rawM=average(180,2000),rawH=average(2000,9000);baseline=mix(baseline,Math.max(.025,(rawB+rawM+rawH)/3),.006);const gain=clamp(.16/Math.max(.045,baseline),.65,2.8)*sensitivity;const vals=[rawB,rawM,rawH].map(x=>clamp(x*gain));energies.bass=mix(energies.bass,vals[0],.25);energies.mids=mix(energies.mids,vals[1],.22);energies.high=mix(energies.high,vals[2],.3);const onset=rawB-prevBass;prevBass=mix(prevBass,rawB,.16);if(onset>.055&&t-lastBeat>.22){beatDecay=1;lastBeat=t}beatDecay*=.88;energies.beat=beatDecay;}else if(demo){energies.bass=mix(energies.bass,.36+.28*Math.pow(Math.sin(t*2.8),8),.15);energies.mids=mix(energies.mids,.26+.25*Math.abs(Math.sin(t*1.7)),.15);energies.high=mix(energies.high,.24+.25*Math.abs(Math.sin(t*4.9)),.2);energies.beat=Math.pow(Math.max(0,Math.sin(t*2.8)),14)}else{for(const k of ['bass','mids','high','beat'])energies[k]*=.94}for(const k of ['bass','mids','high'])$(k).style.width=Math.round(energies[k]*100)+'%'}
function field(x,y,t){const b=energies.bass,m=energies.mids,h=energies.high,beat=energies.beat;const r=Math.hypot(x,y)+.0001,a=Math.atan2(y,x),p=t*.35;switch(settings.preset){case 'tunnel':{const warp=a*7+Math.log(r+.09)*13-t*(1.1+b*2.5);return Math.sin(warp+Math.sin(a*9+p)*2)*.48+Math.cos((x*x-y*y)*12+p*2)*.25+Math.sin(r*29-t*3)*.25}case 'matrix':{const grid=Math.sin((x+Math.sin(y*7+t*.5)*.07)*23)*Math.cos((y+Math.sin(x*8-t*.5)*.07)*21);return grid*.58+Math.sin((x+y)*15+t*(1+m*3))*.25+Math.cos(r*26-t)*.17}case 'vortex':return Math.sin(a*12-r*27+t*(1+b*3)+Math.sin(a*5+t)*2)*.6+Math.cos(r*43+a*4-t*1.7)*.4;case 'rain':{const col=Math.floor((x+1)*33);const seed=Math.sin(col*91.23)*43758.545;const shift=(seed-Math.floor(seed))*8;return Math.sin((y*17+t*(2+h*6)+shift)*2.5)*.42+Math.sin(x*83+shift)*.4+Math.cos(y*43-x*3+t)*.18}default:return Math.sin(y*19+Math.sin(x*9+t*.8)*3+t*(1+m*2))*.42+Math.cos((x*x+y*y)*20-t*(1+b*3))*.35+Math.sin(x*27-y*9+t)*.23}}
const chars={ascii:' .,:;irsXA253hMHGS#9B&@',braille:' ⠁⠃⠇⠏⠟⠿⡿⣿',blocks:' ░▒▓█',binary:' 0011010111'};function draw(now){requestAnimationFrame(draw);if(now-lastFrame<29)return;const dt=Math.min(.06,(now-lastFrame)/1000||.03);lastFrame=now;const t=now/1000;sampleAudio(t);phase+=dt*(.6+energies.bass*1.4);if(Number(settings.auto)>0){if(!nextSwitch)nextSwitch=now+Number(settings.auto)*1000;if(now>=nextSwitch){settings.preset=names[(names.indexOf(settings.preset)+1)%names.length];$('preset').value=settings.preset;try{localStorage.setItem('gf06_preset',settings.preset)}catch{}nextSwitch=now+Number(settings.auto)*1000}}else nextSwitch=0;ctx.fillStyle='#05060a';ctx.fillRect(0,0,width,height);const rgb=colors[settings.palette],r=rgb[0],g=rgb[1],b=rgb[2];const glyphs=chars[settings.style];ctx.font=`${fontSize}px ui-monospace,Menlo,monospace`;ctx.textBaseline='top';const pulse=energies.beat*.12+energies.bass*.1;const jitter=energies.high*.025;const invX=1/Math.max(1,cols-1),invY=1/Math.max(1,rows-1);for(let iy=0;iy<rows;iy++){let ny=(iy*invY-.5)*2;for(let ix=0;ix<cols;ix++){let nx=(ix*invX-.5)*2*(width/height);const rr=Math.hypot(nx,ny);let xx=nx*(1-pulse)+Math.sin(ny*9+phase*2)*jitter;let yy=ny*(1-pulse)+Math.cos(nx*7-phase)*jitter;const v=field(xx,yy,phase);const halo=Math.exp(-rr*rr*.48);const level=clamp((v+1)*.5*.82+halo*.17+energies.mids*.12);const index=Math.min(glyphs.length-1,Math.floor(level*glyphs.length));const ch=glyphs[index];if(ch===' ')continue;const alpha=clamp(.19+level*.85+energies.beat*.17);ctx.fillStyle=`rgba(${r},${g},${b},${alpha.toFixed(2)})`;ctx.fillText(ch,ix*cellW,iy*cellH)}}frame++}requestAnimationFrame(draw);
})();
